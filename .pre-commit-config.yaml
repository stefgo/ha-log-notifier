# `pre-commit install` sets up both hook types below; run it again after
# pulling this change so the pre-push hook exists.
default_install_hook_types: [pre-commit, pre-push]
# The formatting hooks belong to the commit, not to the push.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Only main is pushed; topic branches stay local and are merged with
  # --no-ff (see CLAUDE.md). Dependabot's branches are created on GitHub and
  # never pass through this hook.
  - repo: local
    hooks:
      - id: push-main-only
        name: push main only
        language: system
        entry: >-
          bash -c 'branch=$(git symbolic-ref --short HEAD);
          [ "$branch" = main ] || { echo "Push is only allowed from main (current branch: $branch)."; exit 1; }'
        always_run: true
        pass_filenames: false
        stages: [pre-push]
