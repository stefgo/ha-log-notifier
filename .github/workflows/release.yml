name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # HACS shows the tag, the integration reports the manifest version — if
      # the two drift apart, an update looks installed but is not. The card
      # carries its own version and is bumped in the same step, so it is
      # checked here too rather than being noticed months later.
      - name: Check versions against tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          read_version() { python -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$1"; }
          for file in custom_components/lognotifier/manifest.json card/package.json; do
            version=$(read_version "$file")
            if [ "$tag" != "$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match version $version in $file" >&2
              exit 1
            fi
          done

      # The description is versioned in CHANGELOG.md, so a release never goes
      # out with nothing but a commit list. A missing section stops the tag.
      - name: Assemble release notes
        run: python .github/scripts/release_notes.py "${GITHUB_REF_NAME#v}" release-notes.md

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: card/package-lock.json

      # The built card is not committed; it is created here and travels in the
      # zip, because that is the only copy the HACS install ever sees.
      - run: npm --prefix card ci
      # LOGNOTIFIER_MINIFY is release-only: local builds stay readable.
      - run: npm --prefix card run build
        env:
          LOGNOTIFIER_MINIFY: "1"

      # HACS extracts the zip straight into custom_components/lognotifier, so
      # manifest.json has to sit at the root of the archive.
      - name: Build lognotifier.zip
        run: |
          cd custom_components/lognotifier
          zip -r "$GITHUB_WORKSPACE/lognotifier.zip" . -x '*__pycache__*' '*.pyc'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" lognotifier.zip \
            --title "Log Notifier ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
