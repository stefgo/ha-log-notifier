name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      # Only the Home-Assistant-free modules; see pyproject.toml.
      - run: mypy

  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest

  tests-ha:
    name: pytest (with Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test_ha.txt
      # Its own invocation: these tests need the real Home Assistant fixtures,
      # whereas pytest.ini is set up for the framework-free suite.
      - run: pytest -p no:cacheprovider -c pytest_ha.ini

  card:
    name: card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm --prefix card ci
      - run: npm --prefix card run lint
      # The elements have no DOM-based unit tests, so without this a type
      # error in them reaches CI only if it happens to break the bundler too.
      - run: npm --prefix card run typecheck
      - run: npm --prefix card test
      # The build is what ends up in the release zip — a card that does not
      # compile must not reach a tag.
      - run: npm --prefix card run build
