name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest

  card:
    name: Card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm --prefix card ci
      - run: npm --prefix card test
      # The build is what ends up in the release zip — a card that does not
      # compile must not reach a tag.
      - run: npm --prefix card run build
